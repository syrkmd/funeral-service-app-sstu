version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: funeral-postgres


    environment:
      POSTGRES_DB: funeral_service
      POSTGRES_USER: funeral_user
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: